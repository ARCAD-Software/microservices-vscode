<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ARCAD Transformer Microservices — Documentation</title>
  <link rel="icon" href="_media/microservices.ico" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for the ARCAD Transformer Microservices extension for VSCode.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link id="theme-dark" rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link id="theme-light" rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <style>
    :root {
      --arcad-navy: #0d2b4e;
      --arcad-navy-dark: #081c35;
      --arcad-orange: #f2871a;
      --arcad-orange-dark: #d9720c;
      --theme-color: var(--arcad-navy);
      --link-color: var(--arcad-orange-dark);
    }

    body,
    .markdown-section {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 19px;
      line-height: 1.75;
    }

    code, pre, kbd {
      font-family: 'JetBrains Mono', ui-monospace, monospace !important;
      font-size: 0.92em;
    }

    h1 { font-size: 36px; }
    h2 { font-size: 28px; margin-top: 2.2em; }
    h3 { font-size: 23px; }
    h4 { font-size: 19px; }
    p, li { text-align: left; }

    .markdown-section {
      max-width: 880px;
      padding: 40px 45px 60px;
    }

    /* Default docsify app-name heading is replaced by .sidebar-brand below */
    .app-name-link {
      display: none;
    }

    /* --- Hero section (homepage) --- */
    .hero {
      text-align: center;
      padding: 10px 0 30px;
      border-bottom: 1px solid rgba(120, 120, 120, 0.2);
      margin-bottom: 35px;
    }
    .hero img.hero-logo {
      max-width: 220px;
      margin-bottom: 10px;
    }
    .hero h1 {
      margin: 10px 0 6px;
    }
    .hero p.tagline {
      font-size: 20px;
      opacity: 0.75;
      max-width: 620px;
      margin: 0 auto 22px;
      text-align: center;
    }
    .hero .badges img {
      margin: 0 4px;
    }
    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 1px solid transparent;
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--arcad-orange);
      color: #fff !important;
      box-shadow: 0 2px 10px rgba(242, 135, 26, 0.35);
    }
    .btn-primary:hover {
      background: var(--arcad-orange-dark);
    }
    .btn-secondary {
      background: transparent;
      color: var(--arcad-navy) !important;
      border-color: rgba(120, 120, 120, 0.35);
    }
    html[data-theme-mode="dark"] .btn-secondary { color: #e8ecf1 !important; }
    .btn-secondary:hover {
      border-color: var(--arcad-orange);
    }

    /* --- Feature card grid --- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin: 20px 0 30px;
    }
    .card {
      display: block;
      padding: 18px 20px;
      border-radius: 10px;
      border: 1px solid rgba(120, 120, 120, 0.22);
      text-decoration: none !important;
      color: inherit !important;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      border-color: var(--arcad-orange);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .card .card-icon {
      font-size: 26px;
      margin-bottom: 8px;
      display: block;
    }
    .card h4 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 600;
    }
    .card p {
      margin: 0;
      font-size: 15.5px;
      opacity: 0.75;
      line-height: 1.5;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.55;
      margin: 0 0 4px;
    }

    /* =========================================================
       Premium sidebar
       ========================================================= */
    :root {
      --sidebar-width: 340px;
      --border-radius-m: 8px;
    }

    /* docsify's own core CSS hardcodes the sidebar/content widths — force our
       variable to actually drive the layout, so the resize handle works. */
    .sidebar {
      width: var(--sidebar-width) !important;
      border-right: 1px solid rgba(120, 120, 120, 0.16);
      padding: 0 0 40px;
      background: linear-gradient(180deg, rgba(13, 43, 78, 0.035), transparent 140px);
      box-sizing: border-box;
    }
    .content {
      margin-left: var(--sidebar-width) !important;
    }
    .sidebar-toggle {
      left: var(--sidebar-width) !important;
    }
    @media (max-width: 768px) {
      .content {
        margin-left: 0 !important;
      }
      .sidebar-resize-handle {
        display: none;
      }
    }

    /* Draggable resize handle on the sidebar's right edge */
    .sidebar-resize-handle {
      position: fixed;
      top: 0;
      bottom: 0;
      left: var(--sidebar-width);
      width: 6px;
      margin-left: -3px;
      cursor: col-resize;
      z-index: 40;
      background: transparent;
      transition: background 0.15s ease;
    }
    .sidebar-resize-handle:hover,
    .sidebar-resize-handle.is-dragging {
      background: rgba(242, 135, 26, 0.45);
    }
    body.sidebar-resizing {
      cursor: col-resize;
      user-select: none;
    }
    html[data-theme-mode="dark"] .sidebar {
      background: linear-gradient(180deg, rgba(242, 135, 26, 0.05), transparent 140px);
    }

    /* Custom slim scrollbar */
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 120, 0.35);
      border-radius: 10px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover { background: var(--arcad-orange); }

    /* Brand / logo block */
    .sidebar-brand {
      text-align: center;
      padding: 26px 20px 18px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(120, 120, 120, 0.16);
    }
    .sidebar-brand img {
      max-width: 165px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.12));
    }

    /* Group labels ("Getting Started", "Features", ...) */
    .sidebar-group {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      margin: 22px 0 2px;
    }
    .sidebar-nav > ul > li:first-child .sidebar-group {
      margin-top: 8px;
    }

    /* Reset docsify's default bullet look */
    .sidebar-nav ul {
      margin: 2px 0;
    }
    .sidebar-nav li {
      margin: 1px 0;
    }
    .sidebar-nav li > p {
      margin: 0;
    }

    /* Sidebar icons — keep emoji glyphs small and aligned with the text */
    .sidebar-icon {
      display: inline-block;
      font-size: 15px;
      line-height: 1;
      width: 18px;
      margin-right: 7px;
      text-align: center;
      vertical-align: -2px;
    }
    .sidebar-nav ul ul .sidebar-icon {
      font-size: 14px;
      width: 16px;
    }

    /* Let long labels wrap onto a second line instead of being cut off with an ellipsis */
    .sidebar-nav a {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: unset !important;
      word-break: break-word;
      line-height: 1.35;
    }

    /* Top-level links (docsify sometimes wraps a lone link in an extra <p>, e.g. the root "/" item) */
    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > p > a {
      display: flex;
      align-items: flex-start;
      padding: 8px 14px 8px 16px;
      margin: 1px 8px;
      border-radius: var(--border-radius-m);
      font-weight: 600;
      font-size: 16.5px;
      color: inherit;
      border-left: 3px solid transparent;
      transition: background 0.12s ease, border-color 0.12s ease, padding-left 0.12s ease;
    }
    .sidebar-nav > ul > li > a:hover,
    .sidebar-nav > ul > li > p > a:hover {
      background: rgba(120, 120, 120, 0.09);
      padding-left: 20px;
    }

    /* Nested links (sub-pages) */
    .sidebar-nav ul ul {
      border-left: 1px solid rgba(120, 120, 120, 0.18);
      margin-left: 22px;
      padding-left: 4px;
    }
    .sidebar-nav ul ul li a {
      display: flex;
      align-items: flex-start;
      padding: 6px 12px;
      margin: 0 6px;
      border-radius: 6px;
      font-size: 15.5px;
      opacity: 0.82;
      transition: background 0.12s ease, opacity 0.12s ease;
    }
    .sidebar-nav ul ul li a:hover {
      background: rgba(120, 120, 120, 0.09);
      opacity: 1;
    }

    /* Active page highlighting (docsify marks either the <li> or a wrapping <p> as .active) */
    .sidebar-nav li.active > a,
    .sidebar-nav li > p.active > a,
    .sidebar-nav a.active {
      background: rgba(242, 135, 26, 0.12);
      border-left-color: var(--arcad-orange);
      color: var(--arcad-orange-dark) !important;
    }
    html[data-theme-mode="dark"] .sidebar-nav li.active > a,
    html[data-theme-mode="dark"] .sidebar-nav li > p.active > a,
    html[data-theme-mode="dark"] .sidebar-nav a.active {
      color: #ffb066 !important;
    }

    /* Plain <a> resource links inside the sidebar (PDF / marketplace / contact) */
    .sidebar-nav > ul > li > a[target="_blank"] {
      opacity: 0.85;
      font-weight: 500;
    }

    /* Search box restyle */
    .search {
      margin: 0 14px 14px;
      padding: 14px 14px 0 !important;
      border-top: none !important;
    }
    .search .input-wrap {
      border-radius: 8px;
    }
    .search input {
      border-radius: 8px !important;
      border: 1px solid rgba(120, 120, 120, 0.3) !important;
      font-size: 15.5px !important;
    }
    .search .results-panel a,
    .search .results-panel p,
    .search .results-panel h2 {
      font-size: 15px !important;
    }

    /* =========================================================
       Sticky top navbar
       ========================================================= */
    .app-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 20px;
      margin: 0;
      backdrop-filter: saturate(180%) blur(10px);
      background: rgba(255, 255, 255, 0.75);
      border-bottom: 1px solid rgba(120, 120, 120, 0.16);
    }
    html[data-theme-mode="dark"] .app-nav {
      background: rgba(13, 20, 30, 0.72);
    }
    .app-nav > ul {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .app-nav li {
      margin-left: 4px;
    }
    .app-nav li.theme-toggle-item {
      margin-left: auto;
    }
    .app-nav a {
      font-size: 15.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 7px;
      transition: background 0.12s ease;
    }
    .app-nav a:hover {
      background: rgba(120, 120, 120, 0.12);
    }
    .app-nav a.active {
      color: var(--arcad-orange-dark) !important;
    }

    /* Theme toggle button injected via JS */
    #theme-toggle-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      font-size: 14.5px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 7px;
      border: 1px solid rgba(120, 120, 120, 0.3);
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    #theme-toggle-btn:hover {
      border-color: var(--arcad-orange);
      background: rgba(242, 135, 26, 0.08);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      subMaxLevel: 2,
      name: 'ARCAD Transformer Microservices for VSCode',
      loadSidebar: true,
      loadNavbar: true,
      homepage: 'index.md',
      coverpage: false,
      auto2top: true,
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      search: {
        placeholder: 'Search the docs...',
        noData: 'No results found.',
        depth: 4
      },

      flexibleAlerts: {
        note: {
          label: "Note"
        },
        tip: {
          label: "Tip"
        },
        warning: {
          label: "Warning"
        },
        attention: {
          label: "Attention"
        }
      },

      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var themeLink = document.getElementById('theme-dark');
            var lightLink = document.getElementById('theme-light');
            var ICONS = { auto: '🖥️', light: '☀️', dark: '🌙' };
            var LABELS = { auto: 'Auto', light: 'Light', dark: 'Dark' };
            var ORDER = ['auto', 'light', 'dark'];
            var mql = window.matchMedia('(prefers-color-scheme: dark)');

            function apply(mode) {
              if (mode === 'dark') {
                themeLink.media = 'all';
                lightLink.media = 'not all';
              } else if (mode === 'light') {
                themeLink.media = 'not all';
                lightLink.media = 'all';
              } else {
                themeLink.media = '(prefers-color-scheme: dark)';
                lightLink.media = '(prefers-color-scheme: light)';
              }
              var resolved = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
              document.documentElement.setAttribute('data-theme-mode', resolved);
              var btn = document.getElementById('theme-toggle-btn');
              if (btn) {
                btn.innerHTML = ICONS[mode] + ' ' + LABELS[mode];
              }
            }

            mql.addEventListener('change', function () {
              if ((localStorage.getItem('docs-theme') || 'auto') === 'auto') {
                apply('auto');
              }
            });

            var saved = localStorage.getItem('docs-theme') || 'auto';
            apply(saved);

            var nav = document.querySelector('.app-nav ul') || document.querySelector('.app-nav');
            if (nav && !document.getElementById('theme-toggle-btn')) {
              var li = document.createElement('li');
              li.className = 'theme-toggle-item';
              var btn = document.createElement('button');
              btn.id = 'theme-toggle-btn';
              btn.type = 'button';
              btn.innerHTML = ICONS[saved] + ' ' + LABELS[saved];
              btn.addEventListener('click', function () {
                var current = localStorage.getItem('docs-theme') || 'auto';
                var next = ORDER[(ORDER.indexOf(current) + 1) % ORDER.length];
                localStorage.setItem('docs-theme', next);
                apply(next);
              });
              li.appendChild(btn);
              nav.appendChild(li);
            }

            if (!document.querySelector('.sidebar-resize-handle')) {
              var minWidth = 220;
              var maxWidth = 560;
              var savedWidth = localStorage.getItem('docs-sidebar-width');
              if (savedWidth) {
                document.documentElement.style.setProperty('--sidebar-width', savedWidth + 'px', 'important');
              }

              var handle = document.createElement('div');
              handle.className = 'sidebar-resize-handle';
              document.body.appendChild(handle);

              var dragging = false;

              handle.addEventListener('mousedown', function (e) {
                dragging = true;
                handle.classList.add('is-dragging');
                document.body.classList.add('sidebar-resizing');
                e.preventDefault();
              });

              document.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                var width = Math.min(maxWidth, Math.max(minWidth, e.clientX));
                document.documentElement.style.setProperty('--sidebar-width', width + 'px', 'important');
              });

              document.addEventListener('mouseup', function () {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('is-dragging');
                document.body.classList.remove('sidebar-resizing');
                var current = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width');
                localStorage.setItem('docs-sidebar-width', parseInt(current, 10));
              });
            }
          });
        }
      ]
    }
  </script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Theme -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Flexible Alerts (IMPORTANT: après docsify) -->
  <script src="//unpkg.com/docsify-plugin-flexible-alerts"></script>

</body>
</html>
